<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldMine | Luxury Jewelry</title>

<style>

body{
    margin:0;
    font-family:Georgia;
    background:#000;
    color:#D4AF37;
    transition:0.3s;
}

/* ================= HEADER ================= */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#111;
    border-bottom:1px solid gold;
    position:sticky;
    top:0;
    z-index:10;
}

/* LEFT */
.left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:22px;
    color:gold;
    font-style:italic;
    cursor:pointer;
}

/* SEARCH */
.search{
    width:40%;
    padding:8px;
    border:none;
    border-radius:6px;
}

/* RIGHT */
.right{
    display:flex;
    gap:10px;
    align-items:center;
}

/* ================= GRID ================= */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:20px;
}

/* CARD (DESKTOP) */
.card{
    background:#111;
    border:1px solid gold;
    border-radius:10px;
    padding:10px;
    text-align:center;
    transition:0.3s;
}

.card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

/* BUTTON */
button{
    width:100%;
    margin-top:5px;
    padding:6px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
    border-radius:6px;
}

/* ================= PANELS ================= */
.panel{
    position:fixed;
    top:0;
    right:-350px;
    width:300px;
    height:100%;
    background:#111;
    padding:15px;
    transition:0.3s;
    overflow-y:auto;
    border-left:2px solid gold;
    z-index:20;
}

.panel.open{ right:0; }

.item{
    padding:8px;
    border-bottom:1px solid #333;
}

/* =================================================
   📱 PROFESSIONAL MOBILE UI MODE
================================================= */

.mobile{
    background:#0b0b0b;
}

/* HEADER becomes app bar */
.mobile header{
    flex-direction:column;
    gap:8px;
    align-items:stretch;
}

/* search becomes app bar input */
.mobile .search{
    width:100%;
    background:#1a1a1a;
    color:#fff;
}

/* grid becomes clean feed */
.mobile .grid{
    grid-template-columns:1fr;
    padding:10px;
    gap:12px;
}

/* card becomes mobile product tile */
.mobile .card{
    display:flex;
    gap:10px;
    text-align:left;
    align-items:center;
    padding:10px;
    border-radius:16px;
    box-shadow:0 0 10px rgba(255,215,0,0.15);
}

/* image left side */
.mobile .card img{
    width:90px;
    height:90px;
    border-radius:12px;
}

/* text compact */
.mobile .card h4{
    margin:0;
    font-size:14px;
}

/* buttons stacked small */
.mobile button{
    padding:6px;
    border-radius:20px;
    font-size:12px;
}

/* ================= BOTTOM NAV (MOBILE APP STYLE) ================= */

.bottom-nav{
    display:none;
}

.mobile .bottom-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#111;
    border-top:1px solid gold;
    justify-content:space-around;
    padding:10px 0;
    z-index:50;
}

.bottom-nav div{
    color:gold;
    font-size:14px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>

<div class="left">
    <span onclick="toggleMobileUI()" style="cursor:pointer;">📱</span>
    <div class="logo" onclick="location.reload()">GoldMine</div>
</div>

<input class="search" id="search" onkeyup="search()" placeholder="Search products">

<div class="right">
    <span onclick="toggleFilter()">🎛️</span>
    <span onclick="toggleAbout()">ℹ️</span>
    <span onclick="toggleContact()">📞</span>
    <span onclick="toggleWish()">❤️ <span id="wishCount">0</span></span>
    <span onclick="toggleCart()">🛒 <span id="cartCount">0</span></span>
</div>

</header>

<!-- PRODUCTS -->
<div class="grid">

<div class="card">
<img src="https://images.pexels.com/photos/31459470/pexels-photo-31459470.jpeg">
<div>
<h4>Diamond Ring</h4>
<p>1,000,000 PKR</p>
<button onclick="addCart('Diamond Ring')">Cart</button>
<button onclick="addWish('Diamond Ring')">Wishlist</button>
</div>
</div>

<div class="card">
<img src="https://images.pexels.com/photos/1457740/pexels-photo-1457740.jpeg">
<div>
<h4>Gold Earrings</h4>
<p>25,000 PKR</p>
<button onclick="addCart('Gold Earrings')">Cart</button>
<button onclick="addWish('Gold Earrings')">Wishlist</button>
</div>
</div>

</div>

<!-- CART -->
<div class="panel" id="cart">
<h2>Cart</h2>
<div id="cartItems"></div>
</div>

<!-- WISHLIST -->
<div class="panel" id="wish">
<h2>Wishlist</h2>
<div id="wishItems"></div>
</div>

<!-- BOTTOM NAV (MOBILE ONLY) -->
<div class="bottom-nav">
<div onclick="toggleCart()">🛒 Cart</div>
<div onclick="location.reload()">🏠 Home</div>
<div onclick="toggleWish()">❤️ Wish</div>
</div>

<script>

let cart=[];
let wish=[];
let mobile=false;

/* CART */
function addCart(item){
cart.push(item);
document.getElementById("cartCount").innerText=cart.length;

let html="";
cart.forEach(c=>{
html+=`<div class="item">${c}</div>`;
});

document.getElementById("cartItems").innerHTML=html;
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

/* WISHLIST */
function addWish(item){
if(!wish.includes(item)){
wish.push(item);
}
document.getElementById("wishCount").innerText=wish.length;

let html="";
wish.forEach(w=>{
html+=`<div class="item">${w}</div>`;
});

document.getElementById("wishItems").innerHTML=html;
}

function toggleWish(){
document.getElementById("wish").classList.toggle("open");
}

/* SEARCH */
function search(){
let val=document.getElementById("search").value.toLowerCase();
let cards=document.querySelectorAll(".card");

cards.forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(val)
?"block":"none";
});
}

/* MOBILE MODE */
function toggleMobileUI(){
mobile=!mobile;
document.body.classList.toggle("mobile");
}

</script>

</body>
</html>
