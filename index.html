<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldMine | Luxury Jewelry</title>

<style>

body{
margin:0;
font-family:Georgia;
background:#000;
color:#D4AF37;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#111;
border-bottom:1px solid gold;
position:sticky;
top:0;
z-index:10;
}

.left{display:flex;gap:10px;align-items:center;}
.logo{font-size:22px;color:gold;cursor:pointer;}

.search{width:35%;padding:8px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#111;
border:1px solid gold;
padding:10px;
border-radius:10px;
text-align:center;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
}

button{
width:100%;
margin-top:5px;
padding:6px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
}

/* PANELS */
.panel{
position:fixed;
top:0;
right:-400px;
width:320px;
height:100%;
background:#111;
padding:15px;
overflow-y:auto;
transition:0.3s;
border-left:2px solid gold;
z-index:50;
}

.panel.open{right:0;}

.item{padding:5px;border-bottom:1px solid #333;}

/* ADMIN EDIT UI */
.adminItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px;
border-bottom:1px solid #333;
}

.smallBtn{
width:auto;
padding:4px 6px;
font-size:12px;
margin-left:5px;
}

/* QUICK VIEW */
#quickPopup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
z-index:100;
}

.quick-box{
background:#111;
border:2px solid gold;
padding:20px;
width:300px;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:gold;
color:#000;
padding:10px;
display:none;
}

/* MOBILE MODE */
.mobile .grid{grid-template-columns:1fr;}
.mobile header{flex-direction:column;}
.mobile .search{width:100%;}

/* MOBILE NAV */
#mobileNav{
display:none;
position:fixed;
bottom:0;
width:100%;
background:#111;
color:gold;
justify-content:space-around;
padding:10px;
border-top:1px solid gold;
z-index:200;
}

.mobile #mobileNav{
display:flex;
}

</style>
</head>

<body>

<header>
<div class="left">
<span onclick="toggleMobile()">📱</span>
<div class="logo">GoldMine</div>
</div>

<input class="search" onkeyup="search(this.value)">

<div class="right">
<span onclick="openAdminLogin()">🛠️ Admin</span>
<span onclick="toggleCart()">🛒 <b id="cartCount">0</b></span>
<span onclick="toggleWish()">❤️ <b id="wishCount">0</b></span>
</div>
</header>

<!-- PRODUCTS -->
<div class="grid" id="productGrid"></div>

<!-- CART -->
<div class="panel" id="cartPanel">
<button onclick="toggleCart()">⬅ Back</button>
<h3>Cart</h3>
<div id="cartItems"></div>
</div>

<!-- WISHLIST -->
<div class="panel" id="wishPanel">
<button onclick="toggleWish()">⬅ Back</button>
<h3>Wishlist</h3>
<div id="wishItems"></div>
</div>

<!-- QUICK VIEW -->
<div id="quickPopup">
<div class="quick-box">
<h3 id="qName"></h3>
<img id="qImg" style="width:100%">
<p id="qPrice"></p>
<button onclick="closeQuick()">Close</button>
</div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="panel">
<button onclick="closeAdminLogin()">⬅ Back</button>
<h3>Admin Login</h3>
<input id="adminPass" type="password" placeholder="Password">
<button onclick="checkAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="panel" id="adminPanel">
<button onclick="toggleAdmin()">⬅ Back</button>

<h3>Admin Panel</h3>

<!-- ADD -->
<h4>Add Product</h4>
<input id="pName" placeholder="Name">
<input id="pPrice" placeholder="Price">
<input id="pImg" placeholder="Image URL">
<button onclick="addProduct()">Add Product</button>

<hr>

<!-- EDIT -->
<h4>Edit Product</h4>
<select id="editIndex" onchange="loadEdit()"></select>
<input id="eName" placeholder="Edit Name">
<input id="ePrice" placeholder="Edit Price">
<input id="eImg" placeholder="Edit Image">
<button onclick="updateProduct()">Update Product</button>

<hr>

<!-- DELETE LIST -->
<h4>Manage Products</h4>
<div id="adminList"></div>

</div>

<!-- MOBILE NAV -->
<div id="mobileNav">
<div onclick="toggleCart()">Cart</div>
<div onclick="toggleWish()">Wish</div>
<div onclick="openAdminLogin()">Admin</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>

/* SAFE ELEMENTS */
const cartPanel=document.getElementById("cartPanel");
const wishPanel=document.getElementById("wishPanel");
const adminPanel=document.getElementById("adminPanel");
const quickPopup=document.getElementById("quickPopup");

/* DATA */
let saved = JSON.parse(localStorage.getItem("products"));

let products = saved && saved.length ? saved : [
{name:"Diamond Ring",price:1000000,img:"https://images.pexels.com/photos/31459470/pexels-photo-31459470.jpeg"},
{name:"Gold Earrings",price:25000,img:"https://images.pexels.com/photos/1457740/pexels-photo-1457740.jpeg"}
];
function saveProducts(){
localStorage.setItem("products", JSON.stringify(products));
}

let cart=[];
let wish=[];

/* RENDER */
function render(){
let g=document.getElementById("productGrid");
g.innerHTML="";

products.forEach((p,i)=>{
g.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>${p.price} PKR</p>
<button onclick="quickView(${i})">View</button>
</div>`;
});

renderAdmin();
}

/* ADMIN RENDER */
function renderAdmin(){

let list=document.getElementById("adminList");
let select=document.getElementById("editIndex");

list.innerHTML="";
select.innerHTML="";

products.forEach((p,i)=>{

list.innerHTML+=`
<div class="adminItem">
<span>${p.name}</span>
<div>
<button class="smallBtn" onclick="editProduct(${i})">Edit</button>
<button class="smallBtn" onclick="deleteProduct(${i})">Delete</button>
</div>
</div>`;

select.innerHTML+=`<option value="${i}">${p.name}</option>`;
});
}

render();

/* 💣 DELETE */
function deleteProduct(i){
products.splice(i,1);

// ✅ SAVE UPDATED ARRAY TO LOCALSTORAGE
localStorage.setItem("products", JSON.stringify(products));

render();
toast("Deleted");
}

/* ✏️ EDIT */
function editProduct(i){
editIndex.value=i;
loadEdit();
adminPanel.classList.add("open");
}

/* LOAD EDIT */
function loadEdit(){
let i=editIndex.value;
let p=products[i];

eName.value=p.name;
ePrice.value=p.price;
eImg.value=p.img;
}

/* UPDATE */
function updateProduct(){
let i=editIndex.value;

products[i]={
name:eName.value,
price:ePrice.value,
img:eImg.value
};

render();
toast("Updated");
}

/* QUICK VIEW */
function quickView(i){
let p=products[i];
qName.innerText=p.name;
qPrice.innerText=p.price;
qImg.src=p.img;
quickPopup.style.display="flex";
}

function closeQuick(){
quickPopup.style.display="none";
}

/* PANELS */
function toggleCart(){cartPanel.classList.toggle("open");}
function toggleWish(){wishPanel.classList.toggle("open");}
function toggleAdmin(){adminPanel.classList.toggle("open");}

/* ADMIN LOGIN */
function openAdminLogin(){
adminLogin.classList.add("open");
}

function closeAdminLogin(){
adminLogin.classList.remove("open");
}

function checkAdmin(){
if(adminPass.value==="af9009af9009af9009"){
closeAdminLogin();
toggleAdmin();
toast("Admin Opened");
}else toast("Wrong Password");
}

/* ADD PRODUCT (LOCALSTORAGE ENABLED) */
function addProduct(){

// 1. create new product
let newProduct = {
name: pName.value,
price: pPrice.value,
img: pImg.value
};

// 2. push into array
products.push(newProduct);

// 3. SAVE TO LOCALSTORAGE (IMPORTANT)
localStorage.setItem("products", JSON.stringify(products));

// 4. refresh UI
render();

// 5. clear input fields (optional but good UX)
pName.value = "";
pPrice.value = "";
pImg.value = "";

// 6. message
toast("Product Added Successfully");
}

/* SEARCH */
function search(v){
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(v.toLowerCase())?"block":"none";
});
}

/* MOBILE */
function toggleMobile(){
document.body.classList.toggle("mobile");
}

/* TOAST */
function toast(m){
toastBox.innerText=m;
toastBox.style.display="block";
setTimeout(()=>toastBox.style.display="none",1500);
}

let toastBox=document.getElementById("toast");
let adminLogin=document.getElementById("adminLogin");

</script>

</body>
</html>
